<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormAssist - AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--white:#FFFFFF;--bg:#F4F7FB;--blue:#87CEEB;--blue2:#ADD8E6;--blue-dark:#1A6FA8;--navy:#1A2340;--navy2:#2C3E6B;--text:#1A2340;--sub:#6B7A99;--border:#E2EAF4;--coral:#EF4444;--mint:#10B981;--shadow:0 4px 24px rgba(26,111,168,0.10);--shadow2:0 8px 32px rgba(26,111,168,0.18);}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
        .topbar{height:58px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;box-shadow:0 1px 8px rgba(26,35,64,0.05);}
        .t-back{width:38px;height:38px;border-radius:11px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
        .t-center{display:flex;align-items:center;gap:10px;}
        .ai-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue-dark),var(--navy2));display:flex;align-items:center;justify-content:center;font-size:20px;}
        .ai-info .ai-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--navy);}
        .ai-info .ai-status{font-size:11px;color:var(--mint);font-weight:600;}
        .chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
        .msg{display:flex;gap:8px;animation:msgIn 0.3s ease;}
        @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .msg.user{flex-direction:row-reverse;}
        .msg-av{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;align-self:flex-end;}
        .msg.ai .msg-av{background:linear-gradient(135deg,var(--blue-dark),var(--navy2));}
        .msg.user .msg-av{background:var(--bg);border:1px solid var(--border);}
        .msg-bbl{max-width:82%;padding:11px 14px;border-radius:18px;font-size:13px;line-height:1.7;}
        .msg.ai .msg-bbl{background:var(--white);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text);box-shadow:0 1px 4px rgba(26,35,64,0.06);}
        .msg.user .msg-bbl{background:linear-gradient(135deg,var(--blue-dark),var(--navy2));color:white;border-bottom-right-radius:4px;}
        .msg-time{font-size:10px;opacity:0.5;margin-top:4px;}
        .typing-wrap{display:flex;gap:8px;}
        .typing-bbl{background:var(--white);border:1px solid var(--border);border-radius:18px 18px 18px 4px;padding:13px 16px;display:flex;gap:4px;align-items:center;}
        .t-dot{width:7px;height:7px;border-radius:50%;background:var(--blue-dark);animation:tAnim 1.2s ease-in-out infinite;}
        .t-dot:nth-child(2){animation-delay:0.2s;}.t-dot:nth-child(3){animation-delay:0.4s;}
        @keyframes tAnim{0%,100%{transform:scale(0.5);opacity:0.3}50%{transform:scale(1);opacity:1}}
        .quick-chips{display:flex;gap:7px;overflow-x:auto;padding:8px 16px;background:var(--white);border-top:1px solid var(--border);scrollbar-width:none;flex-shrink:0;}
        .quick-chips::-webkit-scrollbar{display:none;}
        .q-chip{padding:7px 13px;border-radius:20px;background:var(--bg);border:1.5px solid var(--border);font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.2s;}
        .q-chip:hover{border-color:var(--blue2);color:var(--text);}
        .chat-bottom{padding:12px 16px;background:var(--white);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;}
        .chat-input{flex:1;padding:12px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:all 0.3s;}
        .chat-input:focus{border-color:var(--blue-dark);background:var(--white);}
        .chat-input::placeholder{color:#B8C5D6;}
        .send-btn{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--blue-dark),var(--navy2));color:white;border:none;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex-shrink:0;}
        .mic-btn{width:44px;height:44px;border-radius:13px;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex-shrink:0;transition:all 0.2s;}
        .mic-btn.listening{background:var(--coral);border-color:var(--coral);}
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);border-radius:12px;padding:11px 20px;color:white;font-size:13px;font-weight:500;transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);z-index:999;white-space:nowrap;}
        .toast.on{transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="t-back" onclick="window.location.href='home.html'">←</div>
        <div class="t-center">
            <div class="ai-avatar">🤖</div>
            <div class="ai-info">
                <div class="ai-name">FormAssist AI</div>
                <div class="ai-status">● Online</div>
            </div>
        </div>
        <div style="width:38px"></div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="quick-chips">
        <div class="q-chip" onclick="sendQ('How to apply for passport?')">🛂 Passport?</div>
        <div class="q-chip" onclick="sendQ('What is PM Kisan scheme?')">🌾 PM Kisan?</div>
        <div class="q-chip" onclick="sendQ('How to make a good CV?')">💼 CV tips?</div>
        <div class="q-chip" onclick="sendQ('Documents for bank account?')">🏦 Bank docs?</div>
        <div class="q-chip" onclick="sendQ('How to write leave application?')">📝 Leave letter?</div>
        <div class="q-chip" onclick="sendQ('What is Ayushman Bharat?')">🏥 Ayushman?</div>
        <div class="q-chip" onclick="sendQ('How to get Aadhar card?')">🪪 Aadhar?</div>
        <div class="q-chip" onclick="sendQ('What is PM Mudra loan?')">💰 Mudra loan?</div>
    </div>

    <div class="chat-bottom">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Voice input">🎤</button>
        <input class="chat-input" id="chatInput" type="text" placeholder="Ask anything about forms..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="send-btn" onclick="sendChat()">➤</button>
    </div>

    <div class="toast" id="toastEl"></div>
    <script src="global-app.js"></script>
    <script>
        // Knowledge base
        var KB = {
            passport: '🛂 <b>Passport Application:</b><br>1. Visit passportindia.gov.in<br>2. Register & book appointment<br>3. Documents needed:<br>• Aadhar Card<br>• PAN Card<br>• Address proof<br>• 10th Certificate<br>• Passport size photo (white bg)<br><br>💰 Fee: Normal ₹1500 | Tatkal ₹3500<br>⏱️ Time: 30-45 days (Normal)',
            kisan: '🌾 <b>PM Kisan Samman Nidhi:</b><br>• Benefit: ₹6,000/year (3 installments)<br>• Eligible: Small & marginal farmers<br>• Apply at: pmkisan.gov.in<br><br>Documents needed:<br>• Aadhar Card<br>• Land records (7/12)<br>• Bank passbook<br>• Mobile linked to Aadhar<br><br>📞 Helpline: 155261',
            cv: '💼 <b>Good CV Structure:</b><br>1. Name & Contact (top)<br>2. Professional Summary (2-3 lines)<br>3. Key Skills<br>4. Education<br>5. Work Experience / Projects<br>6. Certifications<br><br>💡 Tips:<br>• Keep it 1-2 pages<br>• Use action words<br>• Tailor for each job<br><br>Use our CV Builder for instant AI CV! →',
            bank: '🏦 <b>Bank Account Documents:</b><br><br>Regular Account:<br>• Aadhar Card<br>• PAN Card<br>• Passport size photo<br>• Address proof<br><br>Jan Dhan (Zero Balance):<br>• Only Aadhar Card needed!<br>• No minimum balance<br>• Free debit card + insurance',
            leave: '📝 <b>Leave Application Tips:</b><br>• Address to: Principal/Manager<br>• Mention exact dates<br>• Give valid reason<br>• Keep it polite & formal<br>• Request approval<br><br>Use our Letter Writer for instant AI-generated letter! →',
            ayushman: '🏥 <b>Ayushman Bharat (PMJAY):</b><br>• Free health cover: ₹5 Lakh/year<br>• For poor & vulnerable families<br>• 1,500+ medical procedures covered<br>• Valid at all empanelled hospitals<br><br>Check eligibility: pmjay.gov.in<br>📞 Helpline: 14555',
            aadhar: '🪪 <b>Aadhar Card:</b><br>• Apply/Update: uidai.gov.in<br>• Documents: ID proof + Address proof<br>• Photo + Biometrics at center<br>• Free for new enrollment<br>• Update fee: ₹50<br><br>Download e-Aadhar: myaadhaar.uidai.gov.in<br>📞 Helpline: 1947',
            mudra: '💰 <b>PM Mudra Loan:</b><br>• For small business owners<br>• 3 Types:<br>  - Shishu: up to ₹50,000<br>  - Kishor: ₹50K to ₹5 Lakh<br>  - Tarun: ₹5L to ₹10 Lakh<br><br>• No collateral needed<br>• Apply at any bank<br>• Website: mudra.org.in',
            scholarship: '🎓 <b>National Scholarships:</b><br>• Portal: scholarships.gov.in<br>• For SC/ST/OBC/Minority students<br>• Class 1 to PhD level<br>• Amount: ₹500 to ₹20,000/month<br><br>Documents:<br>• Aadhar Card<br>• Income Certificate<br>• Marksheet<br>• Bank passbook<br>• Caste certificate',
            ration: '🍚 <b>Ration Card:</b><br>• Apply at your local Talathi/Tehsildar office<br>• Or online: nfsa.gov.in<br><br>Documents:<br>• Aadhar Card (all family members)<br>• Address proof<br>• Income certificate<br>• Family photo<br><br>Types: APL / BPL / Antyodaya',
            default: '🤖 I can help you with:<br><br>• 📄 Form filling guidance<br>• 🏛️ Government schemes info<br>• 📋 Document requirements<br>• 💼 CV building tips<br>• ✍️ Application letter writing<br>• 🪪 Aadhar, PAN, Passport info<br><br>Please ask a specific question!'
        };

        // Add initial message
        window.addEventListener('load', function(){
            addMsg('ai', '👋 Hello! I\'m your FormAssist AI Assistant.<br><br>I can help you with forms, government schemes, documents, and more!<br><br>What would you like to know?');
        });

        function getReply(msg) {
            var lower = msg.toLowerCase();
            if(lower.includes('passport') || lower.includes('travel document')) return KB.passport;
            if(lower.includes('kisan') || lower.includes('farmer') || lower.includes('pm kisan')) return KB.kisan;
            if(lower.includes('cv') || lower.includes('resume') || lower.includes('curriculum')) return KB.cv;
            if(lower.includes('bank') || lower.includes('account') || lower.includes('jan dhan')) return KB.bank;
            if(lower.includes('leave') || lower.includes('application') || lower.includes('letter')) return KB.leave;
            if(lower.includes('ayushman') || lower.includes('pmjay') || lower.includes('health insurance')) return KB.ayushman;
            if(lower.includes('aadhar') || lower.includes('aadhaar') || lower.includes('uid')) return KB.aadhar;
            if(lower.includes('mudra') || lower.includes('loan') || lower.includes('business loan')) return KB.mudra;
            if(lower.includes('scholarship') || lower.includes('student') || lower.includes('education')) return KB.scholarship;
            if(lower.includes('ration') || lower.includes('ration card') || lower.includes('bpl')) return KB.ration;
            return KB.default;
        }

        function sendQ(q) {
            document.getElementById('chatInput').value = q;
            sendChat();
        }

        function sendChat() {
            var inp = document.getElementById('chatInput');
            var msg = inp.value.trim();
            if(!msg) return;
            inp.value = '';
            addMsg('user', msg);
            var typing = addTyping();
            setTimeout(function(){
                typing.remove();
                addMsg('ai', getReply(msg));
            }, 800);
        }

        function addMsg(type, content) {
            var area = document.getElementById('chatArea');
            var now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
            var div = document.createElement('div');
            div.className = 'msg ' + type;
            div.innerHTML = '<div class="msg-av">'+(type==='ai'?'🤖':'👤')+'</div>' +
                '<div><div class="msg-bbl">'+content+'</div>' +
                '<div class="msg-time">'+now+'</div></div>';
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            return div;
        }

        function addTyping() {
            var area = document.getElementById('chatArea');
            var div = document.createElement('div');
            div.className = 'typing-wrap';
            div.innerHTML = '<div class="msg-av" style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--blue-dark),var(--navy2));display:flex;align-items:center;justify-content:center;font-size:15px;align-self:flex-end;">🤖</div>' +
                '<div class="typing-bbl"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div>';
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            return div;
        }

        // Voice input
        var isListening = false;
        function toggleMic() {
            var btn = document.getElementById('micBtn');
            if(isListening) {
                stopVoiceInput();
                btn.classList.remove('listening');
                btn.textContent = '🎤';
                isListening = false;
                return;
            }
            isListening = true;
            btn.classList.add('listening');
            btn.textContent = '⏹';
            startVoiceInput(
                function(transcript){
                    isListening = false;
                    btn.classList.remove('listening');
                    btn.textContent = '🎤';
                    document.getElementById('chatInput').value = transcript;
                    sendChat();
                },
                function(error){
                    isListening = false;
                    btn.classList.remove('listening');
                    btn.textContent = '🎤';
                }
            );
        }

        var tt;
        function toast(msg){var el=document.getElementById('toastEl');el.textContent=msg;el.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on');},2500);}
    </script>
</body>
</html>
