<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormAssist - Welfare Schemes</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--white:#FFFFFF;--bg:#F4F7FB;--blue:#87CEEB;--blue2:#ADD8E6;--blue-dark:#1A6FA8;--navy:#1A2340;--navy2:#2C3E6B;--text:#1A2340;--sub:#6B7A99;--border:#E2EAF4;--coral:#EF4444;--mint:#10B981;--amber:#F59E0B;--shadow:0 4px 24px rgba(26,111,168,0.10);--shadow2:0 8px 32px rgba(26,111,168,0.18);}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;padding-bottom:40px;}
        .topbar{position:fixed;top:0;left:0;right:0;height:58px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;box-shadow:0 1px 8px rgba(26,35,64,0.05);}
        .t-back{width:38px;height:38px;border-radius:11px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
        .t-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--navy);}
        .t-title span{color:var(--blue-dark);}
        .page{padding:70px 16px 20px;}
        .hero-card{background:linear-gradient(135deg,var(--blue-dark),var(--navy2));border-radius:22px;padding:24px;text-align:center;margin-bottom:16px;color:white;}
        .hero-ico{font-size:48px;display:block;margin-bottom:12px;animation:float 3s ease-in-out infinite;}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .hero-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;}
        .hero-sub{font-size:13px;opacity:0.8;line-height:1.6;}
        .search-bar{background:var(--white);border:2px solid var(--blue2);border-radius:16px;display:flex;align-items:center;padding:4px 4px 4px 14px;gap:8px;margin-bottom:12px;box-shadow:var(--shadow);}
        .search-bar:focus-within{border-color:var(--blue-dark);}
        .s-ico{font-size:18px;}
        .s-input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;padding:10px 0;}
        .s-input::placeholder{color:#B8C5D6;}
        .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none;}
        .filter-row::-webkit-scrollbar{display:none;}
        .filter-chip{padding:8px 14px;border-radius:20px;background:var(--white);border:1.5px solid var(--border);font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;transition:all 0.2s;flex-shrink:0;}
        .filter-chip.active{background:rgba(26,111,168,0.08);border-color:var(--blue-dark);color:var(--blue-dark);}
        .scheme-list{display:flex;flex-direction:column;gap:10px;}
        .scheme-card{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 1px 4px rgba(26,35,64,0.05);transition:all 0.2s;}
        .scheme-card:hover{border-color:var(--blue2);box-shadow:var(--shadow);}
        .scheme-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
        .scheme-ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
        .scheme-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--navy);margin-bottom:3px;}
        .scheme-ministry{font-size:11px;color:var(--sub);}
        .scheme-badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-left:auto;flex-shrink:0;}
        .badge-green{background:#ECFDF5;color:var(--mint);}
        .badge-blue{background:#EFF8FF;color:var(--blue-dark);}
        .badge-amber{background:#FFFBEB;color:var(--amber);}
        .scheme-desc{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:10px;}
        .scheme-benefit{background:rgba(26,111,168,0.06);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--blue-dark);font-weight:600;margin-bottom:10px;}
        .scheme-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
        .scheme-tag{padding:4px 10px;background:var(--bg);border-radius:10px;font-size:11px;color:var(--sub);}
        .scheme-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--blue-dark),var(--navy2));color:white;border:none;border-radius:11px;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all 0.2s;}
        .scheme-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,111,168,0.3);}
        .no-results{text-align:center;padding:40px 16px;color:var(--sub);}
        .no-results-ico{font-size:48px;display:block;margin-bottom:12px;}
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);border-radius:12px;padding:11px 20px;color:white;font-size:13px;font-weight:500;transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);z-index:999;white-space:nowrap;}
        .toast.on{transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="t-back" onclick="window.location.href='home.html'">←</div>
        <div class="t-title">Welfare <span>Schemes</span></div>
        <div style="width:38px"></div>
    </div>
    <div class="page">
        <div class="hero-card">
            <span class="hero-ico">🏛️</span>
            <div class="hero-title">Government Schemes</div>
            <div class="hero-sub">15+ schemes — search, check eligibility, apply!</div>
        </div>
        <div class="search-bar">
            <span class="s-ico">🔍</span>
            <input class="s-input" id="schemeSearch" type="text" placeholder="Search schemes..." oninput="filterSchemes()">
        </div>
        <div class="filter-row">
            <div class="filter-chip active" onclick="setFilter('all',this)">All</div>
            <div class="filter-chip" onclick="setFilter('farmer',this)">👨‍🌾 Farmer</div>
            <div class="filter-chip" onclick="setFilter('health',this)">🏥 Health</div>
            <div class="filter-chip" onclick="setFilter('education',this)">🎓 Education</div>
            <div class="filter-chip" onclick="setFilter('housing',this)">🏠 Housing</div>
            <div class="filter-chip" onclick="setFilter('women',this)">👩 Women</div>
            <div class="filter-chip" onclick="setFilter('business',this)">💼 Business</div>
        </div>
        <div class="scheme-list" id="schemeList"></div>
    </div>
    <div class="toast" id="toastEl"></div>
    <script src="global-app.js"></script>
    <script>
        var activeFilter = 'all';
        var schemes = [
            {id:1,ico:'🌾',bg:'#ECFDF5',name:'PM Kisan Samman Nidhi',ministry:'Ministry of Agriculture',badge:'Active',badgeClass:'badge-green',desc:'Small and marginal farmers ko ₹6,000 per year milta hai, 3 installments mein.',benefit:'💰 Benefit: ₹6,000/year (₹2,000 × 3 installments)',tags:['Farmer','All States'],url:'https://pmkisan.gov.in',cat:'farmer'},
            {id:2,ico:'🏥',bg:'#EFF8FF',name:'Ayushman Bharat - PMJAY',ministry:'Ministry of Health',badge:'Active',badgeClass:'badge-green',desc:'5 lakh rupaye tak free medical treatment. Poor families ke liye health insurance.',benefit:'💰 Benefit: ₹5 Lakh/year health cover',tags:['Health','BPL Family'],url:'https://pmjay.gov.in',cat:'health'},
            {id:3,ico:'🎓',bg:'#FFFBEB',name:'National Scholarship Portal',ministry:'Ministry of Education',badge:'Active',badgeClass:'badge-green',desc:'SC/ST/OBC/Minority students ke liye scholarships. Class 1 se PhD tak.',benefit:'💰 Benefit: ₹500 to ₹20,000/month',tags:['Education','Students'],url:'https://scholarships.gov.in',cat:'education'},
            {id:4,ico:'🏠',bg:'#EFF8FF',name:'PM Awas Yojana (Urban)',ministry:'Ministry of Housing',badge:'Active',badgeClass:'badge-green',desc:'Shahri garib parivaaron ko pucca ghar. Housing loan mein subsidy milti hai.',benefit:'💰 Benefit: ₹2.67 Lakh subsidy',tags:['Housing','Urban Poor'],url:'https://pmaymis.gov.in',cat:'housing'},
            {id:5,ico:'👩',bg:'#FDF2F8',name:'Beti Bachao Beti Padhao',ministry:'Ministry of Women & Child Dev.',badge:'Active',badgeClass:'badge-green',desc:'Beti ke naam account kholo, tax-free returns pao. Beti ki padhai ke liye.',benefit:'💰 Benefit: Tax-free returns up to 7.6%',tags:['Women','Girls'],url:'https://wcd.nic.in',cat:'women'},
            {id:6,ico:'💼',bg:'#EFF8FF',name:'PM Mudra Yojana',ministry:'Ministry of Finance',badge:'Active',badgeClass:'badge-green',desc:'Chhote business ke liye loan. Shishu (₹50K), Kishor (₹5L), Tarun (₹10L).',benefit:'💰 Benefit: Loan up to ₹10 Lakh',tags:['Business','Self-employed'],url:'https://mudra.org.in',cat:'business'},
            {id:7,ico:'⚡',bg:'#FFF7ED',name:'PM Ujjwala Yojana',ministry:'Ministry of Petroleum',badge:'Active',badgeClass:'badge-green',desc:'BPL families ko free LPG connection. Clean cooking fuel ke liye.',benefit:'💰 Benefit: Free LPG Connection + Cylinder',tags:['Women','BPL Family'],url:'https://pmuy.gov.in',cat:'women'},
            {id:8,ico:'🌊',bg:'#EFF8FF',name:'Jal Jeevan Mission',ministry:'Ministry of Jal Shakti',badge:'Active',badgeClass:'badge-green',desc:'Har ghar mein clean piped water. Rural areas mein nal se jal.',benefit:'💰 Benefit: Free tap water connection',tags:['Rural','All States'],url:'https://jaljeevanmission.gov.in',cat:'all'},
            {id:9,ico:'💳',bg:'#EFF8FF',name:'PM Jan Dhan Yojana',ministry:'Ministry of Finance',badge:'Active',badgeClass:'badge-green',desc:'Zero balance bank account. Debit card, insurance, overdraft facility bhi.',benefit:'💰 Benefit: ₹2 Lakh accident insurance',tags:['Banking','All'],url:'https://pmjdy.gov.in',cat:'all'},
            {id:10,ico:'👴',bg:'#FFF7ED',name:'PM Vaya Vandana Yojana',ministry:'Ministry of Finance',badge:'Active',badgeClass:'badge-green',desc:'60+ senior citizens ke liye pension scheme. Guaranteed 7.4% returns.',benefit:'💰 Benefit: ₹9,250/month pension',tags:['Senior Citizen','Pension'],url:'https://licindia.in',cat:'all'},
            {id:11,ico:'🏗️',bg:'#EFF8FF',name:'PM Gram Sadak Yojana',ministry:'Ministry of Rural Dev.',badge:'Active',badgeClass:'badge-blue',desc:'Rural areas mein roads banaane ki yojana. Gaon ko shehar se connect karna.',benefit:'🏗️ Benefit: Rural connectivity',tags:['Rural','Infrastructure'],url:'https://pmgsy.nic.in',cat:'all'},
            {id:12,ico:'🤱',bg:'#FDF2F8',name:'Pradhan Mantri Matru Vandana',ministry:'Ministry of Women & Child Dev.',badge:'Active',badgeClass:'badge-green',desc:'Pregnant women aur lactating mothers ke liye ₹5,000 cash benefit.',benefit:'💰 Benefit: ₹5,000 maternity benefit',tags:['Women','Pregnant'],url:'https://pmmvy.wcd.gov.in',cat:'women'},
        ];

        function renderSchemes(list) {
            var container = document.getElementById('schemeList');
            if (list.length === 0) {
                container.innerHTML = '<div class="no-results"><span class="no-results-ico">🔍</span><div>No schemes found!</div><div style="font-size:12px;margin-top:6px;">Try different keywords</div></div>';
                return;
            }
            container.innerHTML = list.map(function(s) {
                return '<div class="scheme-card">' +
                    '<div class="scheme-top">' +
                    '<div class="scheme-ico" style="background:' + s.bg + '">' + s.ico + '</div>' +
                    '<div style="flex:1"><div class="scheme-name">' + s.name + '</div><div class="scheme-ministry">' + s.ministry + '</div></div>' +
                    '<span class="scheme-badge ' + s.badgeClass + '">' + s.badge + '</span>' +
                    '</div>' +
                    '<div class="scheme-desc">' + s.desc + '</div>' +
                    '<div class="scheme-benefit">' + s.benefit + '</div>' +
                    '<div class="scheme-tags">' + s.tags.map(function(t){return '<span class="scheme-tag">'+t+'</span>';}).join('') + '</div>' +
                    '<button class="scheme-btn" onclick="applyScheme(\'' + s.url + '\',\'' + s.name + '\')">Apply Now →</button>' +
                    '</div>';
            }).join('');
        }

        function filterSchemes() {
            var q = document.getElementById('schemeSearch').value.toLowerCase();
            var filtered = schemes.filter(function(s) {
                var matchCat = activeFilter === 'all' || s.cat === activeFilter;
                var matchQ = !q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || s.tags.some(function(t){return t.toLowerCase().includes(q);});
                return matchCat && matchQ;
            });
            renderSchemes(filtered);
        }

        function setFilter(cat, el) {
            activeFilter = cat;
            document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active');});
            el.classList.add('active');
            filterSchemes();
        }

        function applyScheme(url, name) {
            toast('🔗 Opening ' + name + '...');
            setTimeout(function(){window.open(url,'_blank');},800);
        }

        renderSchemes(schemes);

        var tt;
        function toast(msg){var el=document.getElementById('toastEl');el.textContent=msg;el.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on');},2500);}
    </script>
</body>
</html>
