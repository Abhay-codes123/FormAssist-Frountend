<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormAssist - Form Auditor</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--white:#FFFFFF;--bg:#F4F7FB;--blue:#87CEEB;--blue2:#ADD8E6;--blue-dark:#1A6FA8;--navy:#1A2340;--navy2:#2C3E6B;--text:#1A2340;--sub:#6B7A99;--border:#E2EAF4;--coral:#EF4444;--mint:#10B981;--amber:#F59E0B;--shadow:0 4px 24px rgba(26,111,168,0.10);--shadow2:0 8px 32px rgba(26,111,168,0.18);}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;padding-bottom:40px;}
        .topbar{position:fixed;top:0;left:0;right:0;height:58px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;box-shadow:0 1px 8px rgba(26,35,64,0.05);}
        .t-back{width:38px;height:38px;border-radius:11px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
        .t-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--navy);}
        .t-title span{color:var(--blue-dark);}
        .page{padding:70px 16px 20px;}
        .hero-card{background:linear-gradient(135deg,var(--blue-dark),var(--navy2));border-radius:22px;padding:24px;text-align:center;margin-bottom:16px;color:white;}
        .hero-ico{font-size:48px;display:block;margin-bottom:12px;animation:float 3s ease-in-out infinite;}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .hero-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;}
        .hero-sub{font-size:13px;opacity:0.8;line-height:1.6;}
        .section{background:var(--white);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(26,35,64,0.05);}
        .sec-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;}
        .field-group{margin-bottom:14px;}
        .field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--sub);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;}
        .field-req{font-size:10px;color:var(--coral);}
        .field-opt{font-size:10px;color:var(--mint);}
        .field-input{width:100%;padding:13px 15px;background:var(--bg);border:1.5px solid var(--border);border-radius:13px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:all 0.3s;}
        .field-input:focus{border-color:var(--blue-dark);background:var(--white);box-shadow:0 0 0 3px rgba(26,111,168,0.1);}
        .field-input::placeholder{color:#B8C5D6;}
        .field-input.ok{border-color:var(--mint);}
        .field-input.err{border-color:var(--coral);}
        .field-hint{font-size:11px;margin-top:5px;padding:5px 10px;border-radius:8px;display:none;}
        .field-hint.show{display:block;}
        .field-hint.ok{background:#ECFDF5;color:var(--mint);}
        .field-hint.err{background:#FEF2F2;color:var(--coral);}
        .field-hint.warn{background:#FFFBEB;color:var(--amber);}
        .score-wrap{text-align:center;padding:20px 0;}
        .score-circle{width:100px;height:100px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:white;position:relative;}
        .score-label{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:0.6px;}
        .score-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:var(--navy);margin-top:8px;}
        .score-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin:12px 0 6px;}
        .score-fill{height:100%;border-radius:4px;transition:width 1s ease;}
        .sum-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
        .sum-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
        .sum-num{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;}
        .sum-lbl{font-size:10px;color:var(--sub);margin-top:2px;}
        .result-card{border-radius:14px;padding:13px;margin-bottom:8px;border:1px solid;}
        .result-card.err{background:#FEF2F2;border-color:#FECACA;}
        .result-card.ok{background:#ECFDF5;border-color:#A7F3D0;}
        .result-card.warn{background:#FFFBEB;border-color:#FDE68A;}
        .result-card.info{background:#EFF8FF;border-color:var(--blue2);}
        .rc-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
        .rc-ico{font-size:18px;}
        .rc-ttl{font-size:13px;font-weight:800;}
        .result-card.err .rc-ttl{color:var(--coral);}
        .result-card.ok .rc-ttl{color:var(--mint);}
        .result-card.warn .rc-ttl{color:var(--amber);}
        .result-card.info .rc-ttl{color:var(--blue-dark);}
        .rc-desc{font-size:12px;color:var(--sub);line-height:1.5;}
        .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue-dark),var(--navy2));color:white;border:none;border-radius:14px;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(26,111,168,0.35);}
        .btn-secondary{width:100%;padding:13px;background:var(--white);border:1.5px solid var(--border);border-radius:14px;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:8px;}
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);border-radius:12px;padding:11px 20px;color:white;font-size:13px;font-weight:500;transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);z-index:999;white-space:nowrap;}
        .toast.on{transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="t-back" onclick="window.location.href='home.html'">←</div>
        <div class="t-title">Form <span>Auditor</span></div>
        <div style="width:38px"></div>
    </div>
    <div class="page">
        <div class="hero-card">
            <span class="hero-ico">🛡️</span>
            <div class="hero-title">Form Auditor</div>
            <div class="hero-sub">Verify form link and check your details before submitting!</div>
        </div>

        <!-- Input Form -->
        <div id="auditForm">
            <div class="section">
                <div class="sec-title">Form Link (Optional)</div>
                <div class="field-group">
                    <label class="field-label">Paste Form URL <span class="field-opt">AI will verify</span></label>
                    <input class="field-input" id="auditLink" type="text" placeholder="https://..." oninput="checkLink(this)">
                    <div class="field-hint" id="linkHint"></div>
                </div>
            </div>

            <div class="section">
                <div class="sec-title">Your Details</div>
                <div class="field-group">
                    <label class="field-label">Full Name <span class="field-req">Required</span></label>
                    <input class="field-input" id="auditName" type="text" placeholder="As per documents" oninput="checkName(this)">
                    <div class="field-hint" id="nameHint"></div>
                </div>
                <div class="field-group">
                    <label class="field-label">Mobile Number <span class="field-req">Required</span></label>
                    <input class="field-input" id="auditMobile" type="tel" placeholder="10 digit mobile" maxlength="10" oninput="checkMobile(this)">
                    <div class="field-hint" id="mobileHint"></div>
                </div>
                <div class="field-group">
                    <label class="field-label">Aadhar Number <span class="field-req">Required</span></label>
                    <input class="field-input" id="auditAadhar" type="text" placeholder="12 digit Aadhar" maxlength="12" oninput="checkAadhar(this)">
                    <div class="field-hint" id="aadharHint"></div>
                </div>
                <div class="field-group">
                    <label class="field-label">PAN Number <span class="field-opt">Optional</span></label>
                    <input class="field-input" id="auditPan" type="text" placeholder="ABCDE1234F" maxlength="10" oninput="checkPan(this)" style="text-transform:uppercase">
                    <div class="field-hint" id="panHint"></div>
                </div>
                <div class="field-group">
                    <label class="field-label">Date of Birth <span class="field-opt">Optional</span></label>
                    <input class="field-input" id="auditDob" type="date">
                </div>
            </div>
            <button class="btn-primary" onclick="runAudit()">🛡️ Run Audit</button>
        </div>

        <!-- Results -->
        <div id="auditResults" style="display:none">
            <div class="section">
                <div class="score-wrap">
                    <div class="score-circle" id="scoreCircle">0</div>
                    <div class="score-label">Safety Score</div>
                    <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
                    <div class="score-title" id="scoreTitle">Checking...</div>
                    <div class="sum-row">
                        <div class="sum-item"><div class="sum-num" id="errCount" style="color:var(--coral)">0</div><div class="sum-lbl">Errors</div></div>
                        <div class="sum-item"><div class="sum-num" id="warnCount" style="color:var(--amber)">0</div><div class="sum-lbl">Warnings</div></div>
                        <div class="sum-item"><div class="sum-num" id="passCount" style="color:var(--mint)">0</div><div class="sum-lbl">Passed</div></div>
                    </div>
                </div>
            </div>
            <div id="resultsList"></div>
            <button class="btn-primary" onclick="document.getElementById('auditResults').style.display='none';document.getElementById('auditForm').style.display='block'">Check Again</button>
            <button class="btn-secondary" onclick="window.location.href='home.html'">Back to Home</button>
        </div>
    </div>
    <div class="toast" id="toastEl"></div>
    <script src="global-app.js"></script>
    <script>
        function checkLink(el){
            var v=el.value.trim();var h=document.getElementById('linkHint');
            if(!v){el.className='field-input';h.className='field-hint';return;}
            if(v.includes('.gov.in')){el.className='field-input ok';h.className='field-hint ok show';h.textContent='✅ Verified government portal!';}
            else if(v.startsWith('http')){el.className='field-input warn';h.className='field-hint warn show';h.textContent='⚠️ Unverified link — proceed carefully';}
            else{el.className='field-input err';h.className='field-hint err show';h.textContent='❌ Invalid URL format';}
        }
        function checkName(el){
            var v=el.value.trim();var h=document.getElementById('nameHint');
            if(!v){el.className='field-input';h.className='field-hint';return;}
            if(/\d/.test(v)){el.className='field-input err';h.className='field-hint err show';h.textContent='❌ Name cannot contain numbers!';}
            else if(v.length<3){el.className='field-input err';h.className='field-hint err show';h.textContent='❌ Enter your full name!';}
            else{el.className='field-input ok';h.className='field-hint ok show';h.textContent='✅ Name looks correct!';}
        }
        function checkMobile(el){
            var v=el.value.replace(/\D/g,'');el.value=v;var h=document.getElementById('mobileHint');
            if(!v){el.className='field-input';h.className='field-hint';return;}
            if(v.length===10&&['6','7','8','9'].includes(v[0])){el.className='field-input ok';h.className='field-hint ok show';h.textContent='✅ Valid mobile number!';}
            else{el.className='field-input err';h.className='field-hint err show';h.textContent='❌ Enter valid 10-digit mobile (starting with 6/7/8/9)';}
        }
        function checkAadhar(el){
            var v=el.value.replace(/\D/g,'');el.value=v;var h=document.getElementById('aadharHint');
            if(!v){el.className='field-input';h.className='field-hint';return;}
            if(v.length===12&&!['0','1'].includes(v[0])){el.className='field-input ok';h.className='field-hint ok show';h.textContent='✅ Valid Aadhar format!';}
            else{el.className='field-input err';h.className='field-hint err show';h.textContent='❌ Aadhar must be 12 digits (not starting with 0 or 1)';}
        }
        function checkPan(el){
            var v=el.value.toUpperCase();el.value=v;var h=document.getElementById('panHint');
            if(!v){el.className='field-input';h.className='field-hint';return;}
            if(/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(v)){el.className='field-input ok';h.className='field-hint ok show';h.textContent='✅ Valid PAN format!';}
            else{el.className='field-input err';h.className='field-hint err show';h.textContent='❌ PAN format: ABCDE1234F';}
        }
        function runAudit(){
            var name=document.getElementById('auditName').value.trim();
            var mobile=document.getElementById('auditMobile').value.trim();
            var aadhar=document.getElementById('auditAadhar').value.trim();
            var pan=document.getElementById('auditPan').value.trim();
            var link=document.getElementById('auditLink').value.trim();
            if(!name||!mobile||!aadhar){toast('⚠️ Please fill Name, Mobile and Aadhar!');return;}
            var results=[];var errors=0,warnings=0,passed=0;
            // Link check
            if(link){
                if(link.includes('.gov.in')){results.push({type:'ok',ico:'✅',ttl:'Verified Government Link',desc:'This is a legitimate government portal. Safe to proceed.'});passed++;}
                else if(link.startsWith('http')){results.push({type:'warn',ico:'⚠️',ttl:'Unverified Link',desc:'This is not a known government portal. Verify carefully before submitting.'});warnings++;}
                else{results.push({type:'err',ico:'❌',ttl:'Invalid Link',desc:'This does not look like a valid URL.'});errors++;}
            }
            // Name
            if(/\d/.test(name)){results.push({type:'err',ico:'❌',ttl:'Name Contains Numbers!',desc:'Names cannot have numbers. This will cause form rejection.'});errors++;}
            else{results.push({type:'ok',ico:'✅',ttl:'Name Format Correct',desc:'Name format is valid for official forms.'});passed++;}
            // Mobile
            if(mobile.length===10&&['6','7','8','9'].includes(mobile[0])){results.push({type:'ok',ico:'✅',ttl:'Mobile Number Valid',desc:'Valid 10-digit Indian mobile number.'});passed++;}
            else{results.push({type:'err',ico:'❌',ttl:'Invalid Mobile Number!',desc:'Enter a valid 10-digit Indian mobile number starting with 6/7/8/9.'});errors++;}
            // Aadhar
            if(aadhar.length===12&&!['0','1'].includes(aadhar[0])){results.push({type:'ok',ico:'✅',ttl:'Aadhar Format Valid',desc:'12-digit Aadhar number format is correct.'});passed++;}
            else{results.push({type:'err',ico:'❌',ttl:'Invalid Aadhar Number!',desc:'Enter a valid 12-digit Aadhar number.'});errors++;}
            // PAN
            if(pan){
                if(/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan)){results.push({type:'ok',ico:'✅',ttl:'PAN Format Valid',desc:'PAN number format is correct (ABCDE1234F).'});passed++;}
                else{results.push({type:'err',ico:'❌',ttl:'Invalid PAN Format!',desc:'PAN must be in format: ABCDE1234F'});errors++;}
            }
            // Score
            var total=errors+warnings+passed;
            var score=Math.round((passed/total)*100);
            if(errors>0) score=Math.min(score,55);
            var color=score>=80?'#10B981':score>=60?'#F59E0B':'#EF4444';
            document.getElementById('scoreCircle').textContent=score;
            document.getElementById('scoreCircle').style.background=score>=80?'linear-gradient(135deg,#10B981,#059669)':score>=60?'linear-gradient(135deg,#F59E0B,#D97706)':'linear-gradient(135deg,#EF4444,#DC2626)';
            document.getElementById('scoreFill').style.width=score+'%';
            document.getElementById('scoreFill').style.background=color;
            document.getElementById('scoreTitle').textContent=errors===0?'✅ Safe to Submit!':score>=60?'⚠️ Fix issues before submitting':'❌ Do NOT submit — fix critical errors first!';
            document.getElementById('errCount').textContent=errors;
            document.getElementById('warnCount').textContent=warnings;
            document.getElementById('passCount').textContent=passed;
            document.getElementById('resultsList').innerHTML=results.map(function(r){
                return '<div class="result-card '+r.type+'"><div class="rc-head"><span class="rc-ico">'+r.ico+'</span><span class="rc-ttl">'+r.ttl+'</span></div><div class="rc-desc">'+r.desc+'</div></div>';
            }).join('');
            document.getElementById('auditForm').style.display='none';
            document.getElementById('auditResults').style.display='block';
            toast(errors===0?'✅ All checks passed!':'⚠️ '+errors+' error(s) found!');
        }
        var tt;
        function toast(msg){var el=document.getElementById('toastEl');el.textContent=msg;el.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on');},2500);}
    </script>
</body>
</html>
